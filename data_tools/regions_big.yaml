# Geographic split: every region (bounding box) belongs to exactly ONE of train / calibration / test.
# bbox = [min_lon, min_lat, max_lon, max_lat]. Each box is about 0.5 x 0.5 degrees (~55 km).
# The coordinates are APPROXIMATE (picked from memory, not checked on a map): run
#   python -m data_tools.preview --region <name>   after the first download and look at the picture.
# Edit freely: add regions, move a region to a different split BEFORE downloading (never after training).
train: [krishna_delta, godavari_plain, deccan_pune, thar_jaisalmer, western_ghats, indus_gangetic_kanpur,
        hyderabad_deccan, bengaluru, mumbai_konkan, delhi_ncr, punjab_ludhiana, odisha_chilika,
        bastar_forest, satpura_forest, kerala_backwaters, cauvery_delta, saurashtra, assam_brahmaputra,
        vidarbha_amravati, raichur_krishna]
calibration: [chennai_coast, nagpur_central, jaipur_arid, visakhapatnam_coast]
test: [rann_kutch, dehradun_foothills, bengal_sundarbans, lucknow_plain, goa_coast, udaipur_hills]
